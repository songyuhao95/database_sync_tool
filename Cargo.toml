[workspace]
members = ["crates/change_event", "crates/mysql_source_contract", "crates/mysql_5_7", "crates/mysql_8_0", "crates/mysql_8_4", "crates/web_ui", "crates/postgresql_15", "crates/postgresql_16", "crates/postgresql_17"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
change_event = { path = "crates/change_event" }
mysql_source_contract = { path = "crates/mysql_source_contract" }
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.10.9"
mysql-driver = { package = "mysql", version = "28.0.0", default-features = false, features = ["minimal-rust", "binlog"] }
mysql-common = { package = "mysql_common", version = "0.37.3", default-features = false, features = ["binlog"] }

[package]
name = "cdc-binlog-tail"
default-run = "cdc-binlog-tail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
change_event.workspace = true
mysql_5_7 = { path = "crates/mysql_5_7" }
mysql_8_0 = { path = "crates/mysql_8_0" }
mysql_8_4 = { path = "crates/mysql_8_4" }

[dev-dependencies]
mysql = { package = "mysql", version = "28.0.0", default-features = false, features = ["minimal-rust", "binlog"] }
serde_json.workspace = true
base64.workspace = true
postgresql_15 = { path = "crates/postgresql_15" }
postgresql_16 = { path = "crates/postgresql_16" }
postgresql_17 = { path = "crates/postgresql_17" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
