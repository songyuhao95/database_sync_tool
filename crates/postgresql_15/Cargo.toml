[package]
name = "postgresql_15"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
change_event.workspace = true
base64.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
pg_walstream = "=0.8.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
mysql-driver.workspace = true
mysql_5_7 = { path = "../mysql_5_7" }
mysql_8_0 = { path = "../mysql_8_0" }
mysql_8_4 = { path = "../mysql_8_4" }
